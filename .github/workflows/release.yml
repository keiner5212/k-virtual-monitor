name: "Create Releases"

# The release is built only when it is asked for. A push to main must not
# create a draft on every commit.
on:
    workflow_dispatch:

jobs:
    publish-tauri:
        permissions:
            contents: write
        # Only Linux for now: the desktop app is the Linux server, and the
        # other platforms come when they are supported.
        runs-on: "ubuntu-22.04"

        steps:
            - name: Checkout repo
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13
                  cache: "pnpm"

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./apps/desktop/src-tauri -> target"

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xdg-utils

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm -r typecheck

            - name: Test
              run: pnpm -r test

            - name: Lint
              run: pnpm -r lint

            - name: Test the Rust workspace
              run: cargo test --workspace

            - name: Build frontend
              run: pnpm --filter @kvm/desktop build

            - name: Create Tauri release
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  tagName: app-v__VERSION__
                  releaseName: "App v__VERSION__"
                  releaseBody: "See the assets to download this version and install."
                  releaseDraft: true
                  prerelease: false
                  args: ""
