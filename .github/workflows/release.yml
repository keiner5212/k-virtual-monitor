name: "Create Releases"

# CI on main is the gate. A pull request does not publish.
on:
    workflow_run:
        workflows: ["CI"]
        types: [completed]
        branches: [main]

jobs:
    publish-tauri:
        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
        permissions:
            contents: write
        # Only Linux for now: the desktop app is the Linux server, and the
        # other platforms come when they are supported.
        runs-on: "ubuntu-22.04"

        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13
                  cache: "pnpm"

            - name: Require a changelog entry for this version
              run: node scripts/changelog.mjs

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./apps/desktop/src-tauri -> target"

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    xdg-utils

            - name: Install frontend dependencies
              run: pnpm install --frozen-lockfile

            - name: Read the app version
              id: app-version
              run: |
                  version=$(node -p "require('./apps/desktop/package.json').version")
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  delimiter="notes_$(openssl rand -hex 16)"
                  echo "notes<<${delimiter}" >> "$GITHUB_OUTPUT"
                  node scripts/changelog.mjs body >> "$GITHUB_OUTPUT"
                  echo "${delimiter}" >> "$GITHUB_OUTPUT"

            - name: Create Tauri release
              uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  projectPath: apps/desktop
                  tagName: v${{ steps.app-version.outputs.version }}
                  releaseName: "k-virtual-monitor v${{ steps.app-version.outputs.version }}"
                  releaseBody: ${{ steps.app-version.outputs.notes }}
                  releaseDraft: true
                  prerelease: false
                  args: ""
