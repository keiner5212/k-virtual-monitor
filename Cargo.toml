[workspace]
resolver = "2"
members = ["packages/protocol/rust", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
kvm-protocol = { path = "packages/protocol/rust" }

[profile.release]
# A panic must not take the server down: the phones have to be able to
# connect again. The thread that panicked dies, the others keep working.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
