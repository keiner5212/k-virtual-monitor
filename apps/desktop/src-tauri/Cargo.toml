[package]
name = "kvm-desktop"
version = "0.1.5"
description = "k-virtual-monitor desktop server"
authors = ["k-virtual-monitor"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "kvm_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
kvm-protocol = { path = "../../../packages/protocol/rust" }
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "net",
  "io-util",
  "time",
  "sync",
  "signal",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.9"
zbus = { version = "5", features = ["blocking"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
